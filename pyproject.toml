[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-scheduler"
version = "0.1.0"
description = "Bounded local jobs and completion delivery for a dedicated Codex worker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Looptimum (ddy6)"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
codex = ["websockets>=15,<18"]

[project.scripts]
codex-scheduler = "codex_scheduler.__main__:main"

[project.urls]
Source = "https://github.com/ddy6/codexScheduler"
Issues = "https://github.com/ddy6/codexScheduler/issues"

[tool.setuptools]
packages = ["codex_scheduler"]
include-package-data = false

[tool.setuptools.data-files]
"share/codex-scheduler/skills/bounded-workflow" = ["skills/bounded-workflow/SKILL.md"]
"share/codex-scheduler/skills/bounded-workflow/agents" = ["skills/bounded-workflow/agents/openai.yaml"]
"share/codex-scheduler/skills/bounded-workflow/references" = ["skills/bounded-workflow/references/usage.md"]
"share/codex-scheduler/skills/bounded-workflow/scripts" = ["skills/bounded-workflow/scripts/scheduler.py"]
"share/codex-scheduler/examples" = ["examples/project.toml"]
